var title = titles[Math.floor(Math.random() * titles.length)], start = 1;
document.title = title;
function titlemove() {
    document.title = title.substring(start) + title.substring(0, start);

}

function filterGames(letter) {
    var rows = document.getElementsByClassName('game-row');
    for (var i = 0; i < rows.length; i++) {

        if (letter === 'ALL' || titleText.startsWith(letter)) {
            rows[i].style.display = '';
        } else {
            rows[i].style.display = 'none';
        }
    }
}
